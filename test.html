<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test - Načítání souborů</title>
</head>
<body>
    <h1>Test načítání souborů</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        // Test CSS
        const cssFiles = ['./css/styles.css', './css/timer.css', './css/breathing.css'];
        const jsFiles = ['./js/storage.js', './js/i18n.js', './js/timer.js', './js/audio.js', './js/breathing.js', './js/app.js'];

        results.innerHTML += '<h2>CSS soubory:</h2>';
        cssFiles.forEach(file => {
            fetch(file)
                .then(r => results.innerHTML += `<p style="color:green">✓ ${file} (${r.status})</p>`)
                .catch(e => results.innerHTML += `<p style="color:red">✗ ${file} - ${e.message}</p>`);
        });

        results.innerHTML += '<h2>JS soubory:</h2>';
        jsFiles.forEach(file => {
            fetch(file)
                .then(r => results.innerHTML += `<p style="color:green">✓ ${file} (${r.status})</p>`)
                .catch(e => results.innerHTML += `<p style="color:red">✗ ${file} - ${e.message}</p>`);
        });

        results.innerHTML += '<h2>Console log:</h2>';
        console.log('Test spuštěn - zkontrolujte F12 Console');
    </script>
</body>
</html>
