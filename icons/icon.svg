<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Meditation Icon -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#1a1a2e"/>

  <!-- Outer glow -->
  <circle cx="256" cy="256" r="180" fill="url(#grad1)" opacity="0.3"/>

  <!-- Person meditating -->
  <g transform="translate(256, 280)">
    <!-- Head -->
    <circle cx="0" cy="-80" r="40" fill="url(#grad1)"/>

    <!-- Body -->
    <ellipse cx="0" cy="-20" rx="35" ry="50" fill="url(#grad1)"/>

    <!-- Legs (lotus position) -->
    <path d="M -50 10 Q -40 30 -30 20 L -15 10 Q 0 5 15 10 L 30 20 Q 40 30 50 10"
          fill="url(#grad1)" stroke="none"/>

    <!-- Arms -->
    <ellipse cx="-45" cy="-10" rx="15" ry="35" fill="url(#grad1)" transform="rotate(-20 -45 -10)"/>
    <ellipse cx="45" cy="-10" rx="15" ry="35" fill="url(#grad1)" transform="rotate(20 45 -10)"/>
  </g>

  <!-- Lotus petals -->
  <g transform="translate(256, 380)">
    <ellipse cx="-60" cy="0" rx="25" ry="15" fill="#667eea" opacity="0.6"/>
    <ellipse cx="60" cy="0" rx="25" ry="15" fill="#667eea" opacity="0.6"/>
    <ellipse cx="-40" cy="15" rx="20" ry="12" fill="#764ba2" opacity="0.5"/>
    <ellipse cx="40" cy="15" rx="20" ry="12" fill="#764ba2" opacity="0.5"/>
    <ellipse cx="0" cy="20" rx="30" ry="15" fill="#667eea" opacity="0.7"/>
  </g>

  <!-- Chakra/Energy circles -->
  <circle cx="256" cy="160" r="8" fill="#667eea" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="180" r="8" fill="#764ba2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="200" r="8" fill="#667eea" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
